:root{color-scheme:dark;--bg:#0a201c;--panel:#142e29;--panel2:#1b3a32;--line:#415f51;--cream:#fff3d9;--soft:#c4cdbc;--gold:#ffce76;--mint:#a1e4bf;--red:#f6aaa0;--ink:#1e261c;--head:"Lilita One","Arial Black",system-ui,sans-serif;--body:Rubik,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--cream);font-family:var(--body);min-height:100vh;background:radial-gradient(ellipse at 50% 0,#2c4634 0,transparent 55%),linear-gradient(160deg,#132d26,var(--bg) 65%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background-image:radial-gradient(#e8c983 1px,transparent 1px),radial-gradient(#e8c983 1px,transparent 1px);background-size:113px 113px,173px 173px;background-position:9px 17px,50px 51px;z-index:-1}
a{color:var(--gold)}button,input,select,textarea{font:inherit}button,a,input,textarea,select{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button[disabled],input[disabled]{opacity:.55;cursor:default}button{cursor:pointer}img{max-width:100%;display:block}h1,h2,h3,p{margin:0}p,li{line-height:1.46}p+p{margin-top:.7rem}h1,h2,h3{overflow-wrap:anywhere}h1,h2{font-family:var(--head);font-weight:400}h1{font-size:clamp(2rem,6vw,4.8rem);line-height:.97}h2{font-size:clamp(1.45rem,4vw,2.15rem);line-height:1.05}h3{font-size:1.03rem}small,.muted{color:var(--soft)}small{line-height:1.35}strong{font-weight:700}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:0 max(20px,calc((100vw - 1140px)/2));border-bottom:1px solid #ffffff20;background:#0f261fe8}.top a{text-decoration:none;color:var(--cream);display:flex;align-items:center;gap:.7rem}.brand{font-family:var(--head);font-size:1.35rem;white-space:nowrap}.section-tag,.label{font-size:.75rem;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}.top .section-tag{text-align:right}.camera{width:35px;height:25px;border:2px solid currentColor;color:var(--gold);border-radius:6px;display:inline-grid;place-items:center;position:relative;flex:none}.camera::before{content:"";width:11px;height:11px;border:2px solid currentColor;border-radius:50%;box-shadow:0 0 0 2px #0c251c}.camera::after{content:"";position:absolute;left:6px;top:-5px;width:9px;height:4px;border-radius:2px 2px 0 0;background:currentColor}
main{max-width:1100px;margin:auto;padding:clamp(1rem,4vw,3rem) clamp(.9rem,3vw,1.75rem) 2.5rem;position:relative}.player{max-width:570px}.screen{max-width:1480px}.shell{display:grid;gap:1rem}.panel{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px;padding:clamp(.95rem,2vw,1.45rem);box-shadow:0 14px 32px #06151145;min-width:0}.panel h2,.panel h3{margin-bottom:.65rem}.heading{margin-bottom:.6rem}.subheading{color:var(--soft);margin-top:.65rem}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.split{justify-content:space-between}.stack{display:grid;gap:.8rem}.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid #85a893;border-radius:11px;background:#24463a;padding:.62rem .95rem;min-height:44px;color:var(--cream);text-decoration:none;font-weight:700;line-height:1.2;text-align:center}.btn:hover:not(:disabled){filter:brightness(1.14)}.primary{background:var(--gold);border-color:#ffe0a2;color:var(--ink);box-shadow:0 3px 0 #966233}.mint{background:var(--mint);border-color:var(--mint);color:var(--ink)}.quiet{background:transparent}.warn{color:var(--red);border-color:#a36f65}.small{min-height:38px;padding:.42rem .72rem;font-size:.87rem}.block{width:100%}.tag{font-size:.76rem;color:#e8f1db;background:#25483b;border:1px solid #547762;padding:.26rem .55rem;border-radius:99px;display:inline-block}.gold{color:var(--gold)}.mint-text{color:var(--mint)}.error{color:var(--red)}.notice{border-left:3px solid var(--gold);background:#262e24;border-radius:5px;padding:.7rem .85rem;color:var(--cream)}[hidden]{display:none!important}
.hero{text-align:center;display:grid;justify-items:center;gap:1.5rem;padding:clamp(1.25rem,5vw,4rem) 1rem}.hero .label{color:var(--mint)}.marquee{width:min(760px,100%);padding:22px 16px 26px;background:radial-gradient(ellipse at 50% 5%,#435537,#19392d 72%);border:1px solid #b58850;border-radius:26px;box-shadow:inset 0 0 0 6px #f8cd8019,0 18px 65px #0006;position:relative}.marquee::before,.marquee::after{content:"";display:block;width:min(480px,94%);height:13px;margin:0 auto;background:radial-gradient(circle at center,#ffdd97 0 2px,#fb983866 3px,transparent 6px) repeat-x;background-size:24px 12px}.marquee::after{margin-top:18px}.lockup{font-size:clamp(3.25rem,13vw,8rem);color:var(--cream);line-height:.94;text-shadow:0 4px #866840,0 7px #59422f,0 11px 20px #101a16;letter-spacing:-.045em;margin:.8rem 0 .55rem}.lockup span{color:var(--gold)}.hero .camera{margin:.6rem auto 0;width:49px;height:36px}.hero .camera::before{width:16px;height:16px}.hero p{max-width:34rem;margin:auto}.hero .actions{justify-content:center}.filmstrip{display:grid;grid-template-columns:repeat(5,1fr);width:min(860px,100%);gap:7px;padding:15px 10px;background:repeating-linear-gradient(90deg,transparent 0 9px,#c3b398 9px 15px,transparent 15px 23px) top 3px left/100% 4px no-repeat,repeating-linear-gradient(90deg,transparent 0 9px,#c3b398 9px 15px,transparent 15px 23px) bottom 3px left/100% 4px no-repeat,#22291f;border-radius:9px}.filmstrip div{background:#294539;padding:.7rem .25rem;border:1px solid #55604b;border-radius:4px;font-size:.75rem;font-weight:750}.filmstrip b{display:block;font-size:1.25rem;margin-bottom:.25rem}
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:1rem;align-items:start}.layout>.stack{min-width:0}.round-card{padding:.7rem .75rem;border:1px solid var(--line);border-radius:9px;background:#102b2480;min-width:0}.round-card summary{margin:.5rem 0}.round-card>label{margin:0;display:flex;gap:.6rem;align-items:center}.round-card label input[type=checkbox]{margin:0;flex:0 0 auto}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.settings-grid .wide{grid-column:1/-1}

async function setStatus(id,status) {

  if (record.kind==="hunt") changes[pth("found",record.owner,record.slot)]=status==="approved" ? true : null;
  if (status==="hidden" && c().visible?.[id]) {
    // A hidden option leaves the public ballot immediately and existing votes for it don't score.
    const current=c();

      ranked:list(current.result.ranked).filter(option=>option.id!==id)} : current.result;

async function startRound(kind, allowSmall=false) {
  if (state.stage==="play" || state.stage==="final" || own(state.results,kind)) return;
  if (!settings().lineup.includes(kind)) return;
  await refreshUploads();
  const round=settings().rounds[kind];
  const present=Object.fromEntries(activePlayers().map(([id])=>[id,true]));
  const current={kind,index:0,size:round.size,prompt:round.prompt,present,roundId:randomId()};
  let deck=[];
  let candidates=[];
  if (guessGame(kind)) {
    const pool=guessPool(kind,present);
    if (pool.length===0) throw Error("No approved photos from players in this round.");
    if (pool.length<4 && !allowSmall) {
      if (!confirm("Only "+pool.length+" approved photos from eligible players. Start this short round?")) return;
    }
    candidates=pool.map(record=>({id:record.owner,name:players[record.owner]?.name || "Photo owner"}));
    deck=shuffle(pool).slice(0,round.size).map(record=>record.id);
  } else if (kind==="caption") {
    const approved=uploadsList().filter(record=>record.status==="approved");
    const picked=captionSelectionTouched ? selectedCaptionPhotos() : approved.filter(record=>record.kind==="caption");
    deck=picked.slice(0,round.size).map(record=>record.id);
    if (!deck.length) throw Error("Pick at least one approved photo for Caption Contest.");
  }
  if (kind==="hunt") {
    current.cue=randomId();
    current.startedAt=Math.round(time());
    current.prompts=list(round.prompts);
    current.size=current.prompts.length;
    current.huntSlots=Object.fromEntries(current.prompts.map((_,index)=>[slotFor("hunt",index),true]));
    await transition({stage:"play",open:false,raw:{},current:timed(current,"hunt",round.seconds)});
    return;
  }
  current.size=deck.length;
  await db.patch({[pth("plans",current.roundId)]:{deck,candidates}});
  await preparePhoto(current,{deck,candidates},true);
}
async function preparePhoto(current,plan,start=false) {
  const kind=current.kind;
  let index=current.index, info;
  while (index<plan.deck.length) {
    info=findPhoto(plan.deck[index]);
    if (info?.status==="approved") break;
    index++;
  }
  if (index>=plan.deck.length) return completeRound(current.kind);
  const options=publicChoices(kind,info,list(plan.candidates),current.present||{});
  const cue=randomId();
  const round=settings().rounds[kind];
  const next=timed({
    kind,roundId:current.roundId,index,size:current.size,prompt:current.prompt,present:current.present || {},cue,
    photo:photoRef(info),visible:{[info.id]:true},options,choiceMap:Object.fromEntries(options.map(choice=>[choice.id,true])),
    ...(kind==="price" ? {title:info.title,ownerName:(players[info.owner]?.name || "Photo owner")+(current.present?.[info.owner]?"":" (not here today)"),double:index===current.size-1} : {}),
    ...(kind==="where" ? {ownerName:(players[info.owner]?.name || "Photo owner")+(current.present?.[info.owner]?"":" (not here today)")} : {})
  }, kind==="caption" ? "write" : "question",round.seconds);
  await db.patch({[pth("ballots",cue,"owner")]:info.owner,[pth("ballots",cue,"photo")]:info.id});
  await transition({stage:"play",open:false,current:next,...(start ? {raw:{}} : {})});
}
async function freeze(phase) {
  const current=c();
  if (current.phase==="locked" && current.lockedFrom===phase) return current;

  await transition({raw:sumScores(state.raw,result.points),current:{...current,phase:"reveal",
    storyUntil:Math.round(time())+(current.kind==="price" ? 15000 : 10000),result:{...result,owner,note:info.note||""}}});
}

async function startCaptionVote() {

  const suppressed=await db.get(pth("hidden",current.cue));
  const ballot=shuffle(rows(captions).filter(([pid,entry])=>!suppressed?.[pid] && entry?.text && photoIdPattern.test(entry.id)).map(([owner,entry])=>({owner,id:entry.id,text:entry.text})));
  await openBallot(current,ballot,Math.min(60,30+2*ballot.length));
}
async function openBallot(current,ballot,seconds) {
  const voteCue=randomId();
  await db.patch({[pth("ballots",voteCue,"owners")]:Object.fromEntries(ballot.map(({id,owner})=>[id,owner]))});
  const options=ballot.map(({id,text,revision})=>({id,...(text?{text}:{revision})}));
  const visible=current.kind==="hunt" ? Object.fromEntries(ballot.map(({id})=>[id,true])) : current.visible || {};
  const next={...current,captionCue:current.kind==="caption" ? current.cue : "",cue:voteCue,ballot:options,visible};
  if (ballot.length<2) {
    const result=scoreBallot(current.kind,ballot,{},players);
    await transition({raw:sumScores(state.raw,result.points),current:{...next,phase:"reveal",
      result:{points:result.points,voters:0,reason:ballot.length ? "One entry. No vote this time." : "No entries for this one."}}});
    return;
  }
  await transition({current:timed(next,"vote",seconds)});
}
async function startHuntVoting() {
  const current=c();
  if (current.phase==="hunt") {
    if (time()<current.endsAt) {
      await transition({current:{...current,endsAt:Math.round(time())}});
      return;
    }
    if (time() >= current.endsAt && time() < current.endsAt+15000) return;
    await freeze("hunt");
  }
  await refreshUploads();
  const locked=c();
  const raw=scoreFinds(uploads,locked.size,locked.cue);
  await openHuntPrompt({...locked,index:0,huntCue:locked.cue},raw);
}
async function openHuntPrompt(current,initialPoints=null) {
  const eligible=shuffle(uploadsList().filter(record=>record.slot===slotFor("hunt",current.index) && record.cue===current.huntCue && record.status==="approved"))
    .slice(0,25).map(record=>({...photoRef(record),owner:record.owner}));

  await openBallot(current,eligible,30);
}

async function revealVote() {

  const responses=await db.get(pth("entries",current.cue));
  const ballot=list(current.ballot).filter(option=>owners[option.id]).map(option=>({...option,owner:owners[option.id]}));

function voteGrid() {

  }).join("")+'</ol>';

function playMarkup() {
  if (role==="player" && !mine()?.ready) return waitingForJoin();

  if (c().kind==="caption") return stageCaption();
  return stageHunt();

const secondsChoices = {whose:[15,20,30],where:[15,20,30],price:[20,25,30],caption:[60,75,90],hunt:[180,300,480]};
function estimate(kind,round) {
  if (kind==="hunt") return round.seconds/60+round.size;
  return round.size * (kind==="caption" ? 3 : kind==="price" ? 1 : .75);
}
function roundSettings(kind,current,selected) {
  const game=GAMES[kind];
  const times=secondsChoices[kind].map(seconds=>[seconds,kind==="hunt"? (seconds/60)+" minutes":seconds+" seconds"]);
  let options;
  if (kind==="hunt") {
    options=selectField("Prompts","hunt-size",current.size,[3,4,5,6,7,8].map(value=>[value,value]))+
      selectField("Hunt clock","hunt-seconds",current.seconds,times)+

      '<div class="wide">'+btn("Shuffle prompts","shuffle","small quiet")+'</div>';
  } else {
    const max=kind==="caption"?5:25;
    const hint=kind==="whose"||kind==="where" ? '<datalist id="prompts-'+kind+'">'+(kind==="whose"?PLATE_PROMPTS:PLACE_PROMPTS).map(prompt=>'<option value="'+h(prompt)+'"></option>').join("")+'</datalist>' : "";
    options='<label class="wide">Prompt<input name="'+kind+'-prompt" value="'+h(current.prompt)+'" maxlength="100" '+(hint?'list="prompts-'+kind+'"':"")+'></label>'+hint+
      selectField(kind==="price"?"Items":"Photos",kind+"-size",current.size,Array.from({length:max},(_,index)=>[index+1,index+1]))+
      selectField(kind==="caption"?"Writing clock":kind==="price"?"Guess clock":"Pick clock",kind+"-seconds",current.seconds,times);

  return '<section class="round-card" data-key="'+kind+'"><label class="inline"><input type="checkbox" name="lineup" value="'+kind+'" '+(selected?"checked":"")+'><strong>'+h(game.name)+'</strong></label>'+
    '<details><summary>Round settings</summary><div class="settings-grid">'+options+'</div></details></section>';

function moderationMarkup() {
  const records=uploadsList().sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||b.at-a.at);
  const captionAvailable=list(settings().lineup).includes("caption");
  const line=(record,index)=>{
    const owner=players[record.owner]?.name || "Host";

    const captionCheck=captionAvailable && record.status==="approved" ? '<label class="inline"><input type="checkbox" data-caption-photo="'+h(record.id)+'" '+
      ((captionSelectionTouched?captionSelected.has(record.id):record.kind==="caption")?"checked":"")+'> Use for Caption Contest</label>' : "";
    const disabledEdit=state.stage==="play" && c().photo?.id===record.id || !(guessGame(record.kind));
    return '<article class="queue-row" data-key="'+h(record.id)+'">'+photoImage(record,"Submission by "+owner)+'<div><div class="row split"><h3>'+h(owner+title)+'</h3><span class="tag">'+h(record.status)+'</span></div>'+
      '<small>'+h(GAMES[record.kind]?.short||"Photo")+(meta?" · "+h(meta):"")+'</small>'+

      '<div class="actions">'+(record.status!=="approved"?btn("Approve","status","small mint",'data-id="'+record.id+'" data-status="approved"'):"")+
      (record.status!=="hidden"?btn("Hide","status","small warn",'data-id="'+record.id+'" data-status="hidden"'):"")+

    (records.length?'<div class="queue scroll">'+records.map(line).join("")+'</div>':empty("Submitted photos will appear here."))+'</section>';

function hostPhotoMarkup() {

        btn(hidden[pid]?"Unhide":"Hide","hideCaption","small "+(hidden[pid]?"quiet":"warn"),'data-id="'+h(pid)+'"')+'</div>').join("")+'</div>' : empty("Captions appear as they’re saved.");

  const contents=list(settings().lineup).map(kind=>{
    const done=own(state.results,kind);

    return '<div class="round-card row split" data-key="'+kind+'"><div><strong>'+h(GAMES[kind].name)+'</strong>'+

      (done?"":btn(kind==="hunt"?"Start hunt":"Start round","start","small mint",'data-kind="'+kind+'"'))+'</div>';

  return '<section class="panel stack"><h2>'+ (state.stage==="board"?"Next round":"Live lineup")+'</h2>'+contents+
    '<div class="actions">'+btn("Final results","final","primary")+'</div></section>';

function render() {
  if (rendering) return;
  rendering=true;
  try {
    let content;
    if (!room) content=homeMarkup();
    else if (!state) content=openingRoom?'<p class="loading">Opening the room…</p>':
      '<section class="panel stack"><h1>Room unavailable</h1><p>Check the link or ask the host for a fresh invitation.</p><a class="btn quiet" href="'+h(linkFor(""))+'">Back to Photo Finish</a></section>';
    else if (isHost()) content=hostMarkup();
    else if (role==="player" && (!mine() || !confirmedIdentity)) content=joinMarkup();
    else if (state.stage==="setup" || state.stage==="lobby") content=lobbyMarkup();
    else if (state.stage==="board" || state.stage==="final") content=boardMarkup(state.stage==="final");
    else content=playMarkup();
    const view = room ? role : "home";
    app.className=view;
    app.setAttribute("aria-busy",String(openingRoom && Boolean(room)));
    document.querySelector("#home").href=linkFor("");
    document.querySelector("#role-label").textContent=demo?"Local practice":isHost()?"Host console":role==="screen"?"Big screen":"Connections";
    const template=document.createElement("template");
    template.innerHTML='<div id="feedback" class="feedback" role="status">'+h(feedback)+'</div>'+
      (connectionLost?'<p class="notice">Reconnecting. Keep this tab open.</p>':"")+
      '<div class="shell" data-key="'+h(view)+'">'+content+'</div>'+
      (demo?'<p class="footer">Practice rooms stay on this browser. Open the player link in another tab to try it.</p>':"");
    syncDom(app,template.content);
    if (db && room) hydratePhotos();
    updateClock();
  } finally {rendering=false;}
}


function applySettings(form) {
  const data=new FormData(form), lineup=data.getAll("lineup").filter(kind=>own(GAMES,kind));
  if (!lineup.length) throw Error("Select at least one round.");
  const rounds=Object.fromEntries(GAME_KEYS.map(kind=>[kind,{
    size:Number(data.get(kind+"-size")),seconds:Number(data.get(kind+"-seconds")),
    prompt:clean(data.get(kind+"-prompt"),100) || GAMES[kind].prompt || ""
  }]));
  const written=String(data.get("hunt-prompts")||"").split(/\r?\n/).map(prompt=>clean(prompt,100)).filter(Boolean);
  rounds.hunt.prompts=[...new Set([...written,...HUNT_PROMPTS])].slice(0,rounds.hunt.size);
  return transition({enabled:Object.fromEntries(lineup.map(kind=>[kind,true])),settings:{lineup,rounds,scoring:data.get("scoring"),board:data.has("board"),absent:data.has("absent"),teamCaption:data.has("teamCaption")}});
}
async function chooseName(form) {
  const name=clean(new FormData(form).get("name"),24);
  if (!name) throw Error("Enter your first name.");
  const equal=rows(players).find(([id,person])=>id!==db.uid && person.name.toLocaleLowerCase()===name.toLocaleLowerCase());
  if (equal) {
    joinCollision=equal[1].name;
    return;
  }
  await db.patch({[pth("players",db.uid)]:{name,ready:false}});
  localStorage.setItem("photo-finish-first-name",name);
  confirmedIdentity=true;
}
async function roomReady() {
  if (!mine()?.ready) await db.patch({[pth("players",db.uid,"ready")]:true});
}
async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try {await navigator.clipboard.writeText(text);return;}
    catch { /* Clipboard permission can be denied in embedded browsers. */ }
  }
  const area=document.createElement("textarea");
  area.value=text;
  area.style.cssText="position:fixed;left:-2000px;top:0";
  document.body.append(area);
  area.select();
  const copied=document.execCommand("copy");
  area.remove();
  if (!copied) throw Error("Clipboard unavailable. Copy the player link from the invite card.");
}
async function sendUpload(form,hostPhoto=false) {
  const kind=hostPhoto ? "caption" : form.dataset.kind;
  const slot=hostPhoto ? "host" : kind;
  if (sending.has(slot)) return;
  const file=form.elements.photo.files[0];
  const metadata=uploadMetadata(kind,form);
  if (metadata===null) return;
  if (!hostPhoto && !(state.stage==="setup" && state.open)) throw Error("Uploads are closed.");
  sending.add(slot);
  const button=form.querySelector('button[type="submit"]');
  if (button) {button.disabled=true;button.textContent="Sending…";}
  tell("Sending photo… Keep this tab open.");
  try {
    await savePhoto(kind,slot,file,metadata,Math.round(time()),hostPhoto);
    if (hostPhoto) form.reset();
    else uploadForm="";
    tell(hostPhoto?"Photo added to the Caption Contest pool.":"Photo sent.");
  } finally {
    sending.delete(slot);
    if (button?.isConnected) {
      button.disabled=false;
      button.textContent=hostPhoto?"Add photo":"Send photo";
    }
    render();
  }
}
async function huntUpload(input) {
  const file=input.files[0], slot=input.dataset.huntUpload;
  if (!file || sending.has(slot)) return;
  const pickedAt=Math.round(time());
  if (c().phase!=="hunt" || pickedAt>=c().endsAt) return tell("The hunt clock has finished.");
  sending.add(slot);
  render();
  try {
    await savePhoto("hunt",slot,file,{},pickedAt);
    tell("Photo sent.");
  } catch(error) {tell(errorMessage(error));}
  finally {
    sending.delete(slot);
    input.value="";
    render();
  }
}
async function hostAction(action,button) {
  const {id,kind,status}=button.dataset;
  if (action==="toggleUploads") {
    if (state.stage==="setup") await transition({open:!state.open});
  } else if (action==="lobby") {
    await transition({stage:"lobby",open:false});
  } else if (action==="start") {
    await startRound(kind);
  } else if (action==="approveAll") {
    await approveAll();
  } else if (action==="status") {
    await setStatus(id,status);
  } else if (action==="revealGuess") {
    await revealGuess();
  } else if (action==="skip") {
    if (c().phase==="question") await freeze("question");
    await nextPhoto();
  } else if (action==="next") {
    await advanceAfterReveal();
  } else if (action==="captionVote") {
    await startCaptionVote();
  } else if (action==="huntVote") {
    await startHuntVoting();
  } else if (action==="revealVote") {
    await revealVote();
  } else if (action==="announceCaption") {
    await announceCaption();
  } else if (action==="extend") {
    await transition({current:{...c(),endsAt:Math.max(c().endsAt,Math.round(time()))+60000}});
  } else if (action==="hideCaption") {
    await db.patch({[pth("hidden",c().cue,id)]:hidden[id]?null:true});
  } else if (action==="final") {
    const hasMore=list(settings().lineup).some(round=>!own(state.results,round));
    if (!hasMore || confirm("Some rounds haven’t been played. Show final results now?")) await transition({stage:"final",open:false,current:null});
  } else if (action==="clear") {
    if (!clearAsk) clearAsk=true;
    else {
      await db.patch({[pth("photos")]:null,[pth("uploads")]:null,[pth("found")]:null});
      photoLoading.clear();
      await transition({cleared:true});
      clearAsk=false;
      tell("Photos cleared. Scores are still available.");
    }
  }
}
async function actionClicked(event) {
  const button=event.target.closest("[data-action]");
  if (!button || button.disabled) return;
  const action=button.dataset.action, id=button.dataset.id;
  if (action==="hostTab") {
    hostTab=id;
    render();
    return;
  }
  if (action==="uploadForm") {
    uploadForm=button.dataset.kind;
    render();
    app.querySelector('#upload-'+uploadForm+' input[type="file"]')?.focus();
    return;
  }
  if (action==="edit") {editId=editId===id?"":id;render();return;}
  if (action==="cancelClear") {clearAsk=false;render();return;}
  if (action==="retryName") {joinCollision="";render();app.querySelector('[name="name"]')?.focus();return;}
  if (action==="confirmName") {confirmedIdentity=true;render();return;}
  if (action==="shuffle") {
    const form=button.closest("form");
    form.elements["hunt-prompts"].value=shuffle(HUNT_PROMPTS).slice(0,Number(form.elements["hunt-size"].value)).join("\n");
    return;
  }
  if (action==="mult") {
    const input=button.closest("form").elements.guess;
    const value=(Number(input.value)||1)*Number(button.dataset.mult);
    input.value=String(Math.min(1000000000,value));
    return;
  }
  if (action==="qr") {
    const anchor=document.createElement("a");
    anchor.href=QR.png(linkFor());
    anchor.download="photo-finish-"+room+"-qr.png";
    anchor.click();
    return;
  }
  if (action==="pick" || action==="vote") {
    if (replyBusy || action==="vote" && myEntry) return;
    replyBusy=true;
    try {await saveResponse(id,false);}
    catch(error) {tell(errorMessage(error));}
    finally {replyBusy=false;}
    return;
  }
  if (busy) return;
  busy=true;
  try {
    if (action==="create") {
      button.disabled=true;
      button.textContent=demo?"Creating practice room…":"Creating room…";
      await createRoom();
    } else if (action==="ready") await roomReady();
    else if (action==="rename") {
      if (!mine()?.ready && !list(myUploads).length) await db.patch({[pth("players",db.uid)]:null});
      else tell("A photo is already linked to this name.");
    } else if (action==="copyInvite" || action==="reminder") {
      const pre=list(settings().lineup).filter(kind=>guessGame(kind)||kind==="caption"&&settings().teamCaption);
      const needed=pre.map(kind=>settings().rounds[kind].prompt).filter(Boolean).join(" and ");
      const text=action==="reminder" ? "Quick Photo Finish reminder: "+(needed?"if you haven’t uploaded yet, send "+needed+" here. ":"use this link to join on game day. ") +linkFor() :
        "Join our next Connections game, Photo Finish! "+(needed?"Send a photo for "+needed+" before the meeting. ":"")+"Use this link again to play live: "+linkFor();
      await copyText(text);
      tell(action==="reminder"?"Reminder copied.":"Invite copied.");
    } else if (isHost()) await hostAction(action,button);
  } catch(error) {
    if (action==="create") {button.disabled=false;button.textContent=demo?"Create a practice room":"Host a live game";}
    tell(errorMessage(error));
  } finally {busy=false;render();}
}
async function formSubmitted(event) {
  const form=event.target.closest("[data-form]");
  if (!form) return;
  event.preventDefault();
  const kind=form.dataset.form;
  try {
    if (kind==="room") {
      const roomId=clean(new FormData(form).get("room"),12).toLowerCase();
      if (!roomPattern.test(roomId)) throw Error("Enter the 12-character room code.");
      location.assign(linkFor(roomId));
    } else if (kind==="upload" || kind==="hostUpload") {
      await sendUpload(form,kind==="hostUpload");
    } else if (kind==="caption" || kind==="price") {
      if (replyBusy || kind==="price" && myEntry) return;
      const data=new FormData(form);
      const value=kind==="caption" ? clean(data.get("caption"),100) : Number(data.get("guess"));
      if (!value) throw Error(kind==="caption"?"Write a caption first.":"Enter a positive amount.");
      replyBusy=true;
      try {await saveResponse(value,kind==="caption");}
      finally {replyBusy=false;}
    } else if (!busy) {
      busy=true;
      try {
        if (kind==="join") await chooseName(form);
        if (kind==="settings") {await applySettings(form);tell("Lineup saved.");}
        if (kind==="edit") {
          const record=findPhoto(form.dataset.id);
          const metadata=uploadMetadata(form.dataset.kind,form);
          if (!metadata || !record) return;
          await db.patch(Object.fromEntries(rows(metadata).map(([field,value])=>[pth("uploads",record.owner,record.slot,field),value])));
          editId="";
          tell("Photo details saved.");
        }
      } finally {busy=false;}
    }
  } catch(error) {tell(errorMessage(error));}
  finally {render();}
}
app.addEventListener("click",actionClicked);
app.addEventListener("submit",formSubmitted);
app.addEventListener("change",event=>{
  const element=event.target;
  if (element.dataset.huntUpload) {huntUpload(element);return;}
  if (element.dataset.captionPhoto) {
    if (!captionSelectionTouched) {
      captionSelected=new Set(uploadsList().filter(record=>record.status==="approved" && record.kind==="caption").map(record=>record.id));
      captionSelectionTouched=true;
    }
    if (element.checked) captionSelected.add(element.dataset.captionPhoto);
    else captionSelected.delete(element.dataset.captionPhoto);
    return;
  }
});
app.addEventListener("input",event=>{
  if (event.target.name!=="caption") return;
  const count=event.target.closest("form").querySelector("[data-caption-count]");
  if (count) count.textContent=event.target.value.length+" / 100";
});
setInterval(updateClock,200);
render();
if (room) enterRoom().catch(error=>{openingRoom=false;tell(errorMessage(error));render();});
</script>
